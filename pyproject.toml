[project]
name = "shogi-dojo"
version = "0.1.0"
description = "NNUE training for Shogi (Japanese Chess)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
