[project]
name = "shogi-dojo"
version = "0.1.0"
description = "NNUE training for Shogi (Japanese Chess)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
    # python-shogi is used only by the AlphaZero survey (src/shogi_dojo/alphazero/
    # rules.py) for legal-move generation and terminal detection. The NNUE
    # pipeline has no Python-side Shogi rule requirements and does not import
    # it. Kept in the main dependency list rather than an extra because a
    # future default AlphaZero training run would need it.
    "python-shogi",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
viz = ["tensorboard"]
# Optional dependencies for exporting AlphaZero/Bonanza checkpoints to
# portable formats (see scripts/alphazero/export_onnx.py and
# export_torchscript.py). ``onnx`` is required for ONNX export itself;
# ``onnxruntime`` adds round-trip verification. TorchScript export
# needs no extras (it is part of torch).
export = ["onnx", "onnxruntime"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the lint rule set explicitly. Without this, ``ruff check`` uses
# ruff's built-in default rules, and CI installs the newest ruff — so a
# ruff release that enlarges its defaults (as 0.17 did: import sorting,
# pyupgrade, logging, ...) fails CI on code that passes locally. These
# are ruff's classic defaults: pycodestyle errors E4/E7/E9 (imports,
# statements, syntax) and all pyflakes F rules (unused imports and
# variables, undefined names). Adopt more rule families deliberately,
# e.g. by adding "I" or "UP" here and fixing the reported code.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]
