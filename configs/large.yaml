# =============================================================================
# Large Model Configuration — Maximum Strength
# =============================================================================
# A larger NNUE model for maximum playing strength. Requires more training
# data and GPU memory, but produces a stronger evaluation.
#
# Parameter count: ~20M (vs ~5M default)
# Use case: final model training with abundant data (1M+ positions)
# =============================================================================

data:
  # Path to the training SFEN file.
  train_path: "data/train.sfen"

  # Path to the validation SFEN file (optional — omit to use train loss for tracking).
  val_path: "data/val.sfen"

  # Positions per training batch. Larger than default for better GPU utilization
  # with the bigger model. Reduce if you get out-of-memory errors.
  batch_size: 16384

  # Parallel data-loading processes. More workers to keep the GPU fed.
  num_workers: 8

model:
  # Feature transformer output dimension per perspective.
  # Both perspectives are concatenated, so the eval network input is ft_out_dim * 2 = 1024.
  # Larger than default (256) for a more expressive model.
  ft_out_dim: 512

  # Hidden layer dimensions for the evaluation network.
  # Larger than default (32) to match the increased feature transformer capacity.
  l1_dim: 64
  l2_dim: 64

training:
  # More epochs than default — larger models need more training to converge.
  epochs: 400

  # Adam learning rate. Slightly lower than default (1e-3) for stability
  # with the larger model — bigger models are more sensitive to large updates.
  lr: 5.0e-4

  # Learning rate schedule. "cosine" smoothly decays LR to ~0 over all epochs.
  lr_scheduler: "cosine"

  # Step scheduler parameters (only used when lr_scheduler is "step").
  lr_step_size: 50
  lr_gamma: 0.5

  # L2 regularization. Small value to prevent overfitting without slowing learning.
  weight_decay: 1.0e-6

  # Loss weights: how much to prioritize engine-score accuracy vs game-result prediction.
  lambda_score: 1.0
  lambda_result: 0.5

  # Divide raw centipawn scores by this before sigmoid. 600 means +600cp ~ 73% win prob.
  score_scaling: 600.0

  # Maximum gradient norm. Gradients larger than this are scaled down.
  clip_grad_norm: 1.0

  # Directory for saving checkpoints.
  checkpoint_dir: "checkpoints"

  # TensorBoard log directory. Set to "" to disable.
  log_dir: "runs"

  # Save a checkpoint every N epochs. Less frequent than default since
  # there are more epochs and each checkpoint is larger.
  save_every: 20

  # Stop training if no improvement for this many consecutive epochs.
  # Higher than default (20) since larger models may have longer plateaus.
  early_stopping_patience: 30
