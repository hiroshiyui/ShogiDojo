# =============================================================================
# Bonanza Method — Default Configuration
# =============================================================================
# Supervised policy + value training from professional game records.
# Trains the same AlphaZeroNetwork architecture using cross-entropy on
# professional moves + MSE on game outcomes.
#
# See doc/bonanza/Bonanza_Reference.md for the full discussion.
# =============================================================================

model:
  # Same architecture as AlphaZero. Default survey size (~336K params).
  num_blocks: 4
  num_filters: 64
  value_head_hidden: 64

training:
  # More epochs than AlphaZero iterations, since each epoch is cheap
  # (no MCTS, no self-play — just forward + backward on a fixed dataset).
  epochs: 50

  # Samples per batch. Large enough to keep a GPU busy — the network
  # is tiny (~336K params) so small batches underutilize the GPU.
  # Halve this if you hit OOM on a smaller GPU; doubling to 2048 is
  # worth trying on an A100 or H100.
  batch_size: 1024

  # Data-loading parallelism. Each worker is a separate Python
  # process that parses CSA and encodes tensors concurrently with
  # the GPU doing forward/backward. Without enough workers the GPU
  # idles waiting for the main thread to encode the next batch.
  # Rule of thumb: start at min(8, CPU_cores). Set to 0 only for
  # single-process debugging.
  num_workers: 8

  # Pin DataLoader output in page-locked memory so the CPU→GPU
  # transfer can happen asynchronously (together with non_blocking=True
  # in the trainer's .to(device) calls). Cuda-only; ignored on CPU.
  pin_memory: true

  # Adam optimizer.
  lr: 1.0e-3
  weight_decay: 1.0e-4

  # Value-head weight. The original Bonanza method used evaluation
  # regression only (no policy head); our dual-head formulation needs
  # a balance. 0.5 gives the policy head twice the gradient weight.
  lambda_value: 0.5

  # Checkpoint directory and frequency.
  #
  # save_every is epoch-based: the trainer saves a checkpoint after
  # every N epochs (and always at the final epoch). Fine for small
  # datasets where an epoch is minutes.
  #
  # save_every_steps is step-based: save a checkpoint every N
  # optimizer steps, regardless of epoch progress. Essential for
  # long-running training on the full wdoor archive, where one
  # epoch is ~13M samples (hours on a single GPU) — without this,
  # a mid-epoch crash loses all progress. A reasonable value for
  # the full dataset is 5000-10000 (≈ every few minutes at GPU
  # speed). Comment out or set to null to disable.
  checkpoint_dir: "checkpoints/bonanza"
  save_every: 10
  save_every_steps: 5000
